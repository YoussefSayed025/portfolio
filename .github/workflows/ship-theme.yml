name: ship-theme
on:
  push:
    paths:
      - .github/workflows/ship-theme.yml
jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown "1TZImsR3G0PvgPPBH3Pt98Kn-xamFAm_v" -O theme.zip && unzip -o theme.zip && rm -f theme.zip && git rm -f --ignore-unmatch aa ab bundle.zip update.zip site-update.zip patch_index.py && git config user.email "bot@users.noreply.github.com" && git config user.name "ship-bot" && git add -A && git commit -m "Add dark/light mode toggle across all pages; remove ship artifacts" && git push
