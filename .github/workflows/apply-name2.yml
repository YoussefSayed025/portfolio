{"name": "apply-name-update-2", "on": "workflow_dispatch", "permissions": {"contents": "write"}, "jobs": {"apply": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Apply", "run": "set -euo pipefail\ncurl -sL --retry 3 -o /tmp/p.tgz https://h.uguu.se/fxiEsVVZDhWR.tgz\necho \"04ab65afcee611b1b8adfbf363fc7036c02ab4635cbdb2a33f9bda2eecae324e  /tmp/p.tgz\" | sha256sum -c -\ntar xzf /tmp/p.tgz\necho \"d2bdfff1fd8ecfbefc92a4fd19d6c7c41225805b3502fd1006d5d569241b45a1  index.html\" | sha256sum -c -\ntest \"$(grep -o 'Youssef Sayed Hawass' index.html | wc -l)\" = 11\ntest \"$(grep -c 'Tolba' index.html)\" = 0\ntest \"$(stat -c %s index.html)\" -gt 500000\ntest \"$(stat -c %s og-image.jpg)\" -gt 20000\ntest \"$(head -c 5 Youssef-Sayed-Hawass-CV.pdf)\" = '%PDF-'\ntest \"$(stat -c %s Youssef-Sayed-Hawass-CV.pdf)\" -gt 300000\ngit config user.name github-actions\ngit config user.email actions@github.com\ngit add index.html og-image.jpg Youssef-Sayed-Hawass-CV.pdf\ngit commit -m 'Use Youssef Sayed Hawass as the professional name'\ngit push\n"}]}}}
