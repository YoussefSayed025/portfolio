name: ship-cleanup
on:
  push:
    paths:
      - '.github/workflows/cleanup.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown 1TLqGpLHbxn0eAzlltjAyCTbqEvCjhRjM -O /tmp/s.zip && unzip -o /tmp/s.zip -d .
      - run: rm -f projects/adventureworks-analysis/docs/DEPI-Final-Project.pptx
      - run: |
          git config user.name youssef
          git config user.email youssef@example.com
          git add -A
          git commit -m "remove graduation wording and drive links, swap adventureworks deck"
          git push
