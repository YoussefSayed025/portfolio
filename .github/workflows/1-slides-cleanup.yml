name: apply-portfolio-slides-cleanup
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          curl -sL --retry 3 -o /tmp/p.tgz https://d.uguu.se/PoJvfcKyDwZw.tgz
          echo "cfb9f4d8010398170f0cf4fba80e3794641fd9adc49f4607bc06d8a16164bf11  /tmp/p.tgz" | sha256sum -c -
          tar xzf /tmp/p.tgz
          git rm -q slides/rakeeza/19.webp
          git rm -q slides/rakeeza/20.webp
          git rm -q slides/urbanization/22.webp
          git rm -q slides/urbanization/23.webp
          git rm -q slides/urbanization/24.webp
          git rm -q slides/urbanization/25.webp
          git rm -q slides/urbanization/26.webp
          git rm -q slides/urbanization/27.webp
          git rm -q slides/urbanization/28.webp
          git rm -q slides/urbanization/29.webp
          test "$(ls slides/rakeeza | wc -l)" = 18
          test "$(ls slides/urbanization | wc -l)" = 21
          test "$(ls slides/mobile-payment | wc -l)" = 29
          test "$(grep -c '"dir": "slides/rakeeza", "n": 18' index.html)" = 1
          test "$(grep -c '"dir": "slides/urbanization", "n": 21' index.html)" = 1
          test "$(stat -c %s index.html)" -gt 500000
          test "$(grep -c 'const cats' index.html)" = 1
          git config user.name "portfolio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Remove broken slides, fix placeholders, sharpen portrait decks"
          git push
