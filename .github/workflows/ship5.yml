name: ship-rename
on: [push]
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown
      - run: gdown 1cIlwubwG3MerK7bsvUNk5NmmgN5vVTAk -O ship.zip
      - run: unzip -o ship.zip -d .
      - run: rm -rf projects/hr-trends
      - run: rm -f projects/profit-returns/grad-project.pbix projects/profit-returns/src/grad-project.ipynb projects/hr-analytics/DEPI-FINAL-PROJECT.pptx
      - run: rm -f .github/workflows/ship2.yml .github/workflows/ship3.yml .github/workflows/ship4.yml .github/workflows/ship5.yml
      - run: |
          git config user.email "action@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -m "merge hr folders, rename grad-named files, neutral readme wording"
          git push
