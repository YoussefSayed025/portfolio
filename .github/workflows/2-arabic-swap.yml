name: Arabic wording swap
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  swap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Arabic wording in index.html
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          n1 = t.count('المبعثرة')
          t = t.replace('المبعثرة', 'غير المنظمة')
          n2 = t.count('مبعثر')
          t = t.replace('مبعثر', 'غير منظم')
          assert n1 == 3 and n2 == 1, f'unexpected counts: {n1}, {n2}'
          p.write_text(t, encoding='utf-8')
          print(f'replaced definite={n1} indefinite={n2}')
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Arabic wording: change mub'athara to ghayr al-munazzama"
          git push
