name: purge-depi
on:
  push:
    paths:
      - '.github/workflows/purge.yml'
permissions:
  contents: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install git-filter-repo
      - run: |
          git config user.name youssef
          git config user.email youssef@example.com
          git filter-repo --path projects/adventureworks-analysis/docs/DEPI-team.xlsx --invert-paths --force
          git remote add origin https://github.com/YoussefSayed025/portfolio.git || true
          git push origin main --force
