name: upload-research-files
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upload-research.yml'
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files and commit
        run: |
          mkdir -p files slides/research-proposal slides/efinance-analysis
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1Dr-Xda-9FbyQADtd9t7zp9bJIOrghNXT' -o 'index.html'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=18QjrqMNFIVdJx3S7AbC97FXXDS8cICOq' -o 'files/Mobile-Payments-Financial-Inclusion-Research-Proposal.pdf'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1xMfDSV1RQ802g_xVTDu3_F6ZdiasHDeB' -o 'files/EFinance-Financial-Ratio-Analysis.pdf'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1sk5c3eI5Mq8locmMoICUgE3J_bKppCsy' -o 'slides/research-proposal/01.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1YQYOzeTAiXcAUW7avdfPahDD1MOcWrce' -o 'slides/research-proposal/02.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1wy1H3OxeXF_NynsSJrqkZqu7Omlr91DM' -o 'slides/research-proposal/03.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=11LkkhAG070xh2EXo97VoLWXawAxnY7W5' -o 'slides/research-proposal/04.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1a3uU-KL14O263Wqr0OVztpamZu_Su9jf' -o 'slides/research-proposal/05.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1b29mUXZDIjz5mMtEAQp2NQ-C15mygxqR' -o 'slides/research-proposal/06.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1cPAh3oPYFlSwx4CG-Xxy38zYLf5uyJgM' -o 'slides/research-proposal/07.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1suXmvXR5O00Y4UVLlFfxlfKq7UKtdEzL' -o 'slides/research-proposal/08.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1jUaipVk9e526tuBmr7lM4c3sW1ys-_7f' -o 'slides/research-proposal/09.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1CtpC_UnoH3qFETsXEIj8lefsjlLg3pEU' -o 'slides/research-proposal/10.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=10qNLXKs4UAPWo-BkcII4qGr2VIbYmL9z' -o 'slides/research-proposal/11.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1QfPeN4veQiPKkCjcltjghKoFPkflqt4-' -o 'slides/research-proposal/12.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1prnGnvS3JjXeoNTPyluc21gGf3Nmwj8f' -o 'slides/research-proposal/13.webp'
