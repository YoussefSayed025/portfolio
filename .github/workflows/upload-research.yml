          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1zCqUarwyz7YT9IOB8bIhn8FmyxsL7sJW' -o 'slides/research-proposal/17.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1XP6sttJBSJl8Rf8k3l5bAmQavPm3hex2' -o 'slides/research-proposal/18.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1mIM0HkSaYxpICtrt-rO1zKtrMUY_fabR' -o 'slides/efinance-analysis/01.webp'
