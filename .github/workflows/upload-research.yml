          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1JUjx2HO4etjDdR3mHAKRoL-6HxCTugFx' -o 'slides/efinance-analysis/03.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1_B3cQtmLDnJ08GM3N0xx6u6IoaBLbqhv' -o 'slides/efinance-analysis/04.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1OdloJi3Pw1bA3A9XBo7iPZKXEn1Nj4ik' -o 'slides/efinance-analysis/05.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1QSZArh7u7V6s1XsmAwGQefBBJ8bEwEYb' -o 'slides/efinance-analysis/06.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1qv3_jysKtApR6sTSXWioluDIl4KpYiOP' -o 'slides/efinance-analysis/07.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=14eDoJ1FWb1KDSICgx18nQlUntFGBf9IX' -o 'slides/efinance-analysis/08.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1u8aADNlRwcfj8YdDNhC4P-PniL0neBrW' -o 'slides/efinance-analysis/09.webp'
          curl -sfL --retry 3 'https://drive.google.com/uc?export=download&id=1DEnyy_KqH9Pt2UtT0CbP95wjmafVavh7' -o 'slides/efinance-analysis/10.webp'
          rm -f slides/research-proposal/.gitkeep

          git config user.email 'actions@github.com'
          git config user.name 'github-actions'
          git add -A
          git commit -m 'Add research section: two papers with page previews'
          git push
