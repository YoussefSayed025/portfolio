{"name": "apply-cv-email", "on": "workflow_dispatch", "permissions": {"contents": "write"}, "jobs": {"apply": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Apply", "run": "set -euo pipefail\ncurl -sL --retry 3 -o /tmp/p.tgz https://n.uguu.se/edEMVegPBJdF.tgz\necho \"68cf1ccfa5a97cf65bf63db1d786821373229662f3955333430af46423d84ca9  /tmp/p.tgz\" | sha256sum -c -\ntar xzf /tmp/p.tgz\necho \"47b64eb5d59cadf58bcee38a9a0a340c0995bc70875272e304d63b82af9804a9  Youssef-Sayed-Hawass-CV.pdf\" | sha256sum -c -\ntest \"$(head -c 5 Youssef-Sayed-Hawass-CV.pdf)\" = '%PDF-'\ntest \"$(stat -c %s Youssef-Sayed-Hawass-CV.pdf)\" -gt 300000\ngit config user.name github-actions\ngit config user.email actions@github.com\ngit add Youssef-Sayed-Hawass-CV.pdf\ngit commit -m 'Use yossefsayed025@gmail.com in the CV'\ngit push\n"}]}}}
