name: tmp-projects-update
on:
  push:
    paths: ['.github/workflows/tmp-projects-update.yml']
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gdown
      - run: gdown 1_d86i3Xjc3RZBZO7X4RpA6EVNsyJmc1a -O site-update.zip
      - run: unzip -o site-update.zip -d .
      - run: python patch_index.py
      - run: |
          git config user.name 'YoussefSayed025'
          git config user.email 'youssefsayed025@users.noreply.github.com'
          git add -A
          git commit -m "Add dashboard detail pages and project source folders"
          git push
