name: ship-hrmerge
on: [push]
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown
      - run: gdown 1_NUYlChlvj-_PiMnHwDOpqeomCBu3OiD -O ship.zip
      - run: unzip -o ship.zip -d .
      - run: rm -rf projects/hr-trends .github/workflows/ship2.yml .github/workflows/ship3.yml .github/workflows/ship4.yml
      - run: |
          git config user.email "action@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -m "merge hr-trends into hr-analytics, drop temp ship workflows"
          git push
