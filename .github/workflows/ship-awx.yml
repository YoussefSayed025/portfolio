name: ship-awx
on:
  push:
    paths:
      - .github/workflows/ship-awx.yml
jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown "17w4zaGWen1SA1Nu-eoMbhRQ66NMtZiE_" -O awx.zip && unzip -o awx.zip && rm -f awx.zip && git rm -f --ignore-unmatch "projects/adventureworks-analysis/docs/DEPI-team.xlsx" && git config user.email "bot@users.noreply.github.com" && git config user.name "ship-bot" && git add -A && git commit -m "Remove team contact workbook from public project" && git push
