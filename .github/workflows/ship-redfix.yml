name: ship-redfix
on:
  push:
    paths:
      - .github/workflows/ship-redfix.yml
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown 19kBBLR764b1hDkuTfPl01P3YB7STM54Z -O /tmp/s.zip && unzip -o /tmp/s.zip -d .
      - run: git config user.email "action@github.com" && git config user.name "github-actions" && git add -A && git commit -m "Redo cover redactions preserving fills" && git push
