name: tmp-sales-data
on:
  push:
    paths: ['.github/workflows/tmp-sales-data.yml']
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gdown
      - run: gdown 1jTEvX-1lF9NAnjdVHhly5uJtDaotNenI -O update.zip
      - run: unzip -o update.zip -d .
      - run: |
          git config user.name 'YoussefSayed025'
          git config user.email 'youssefsayed025@users.noreply.github.com'
          git add -A
          git commit -m "Add sales cleaning data file and presentation"
          git push
