name: ship-aw2
on: [push]
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown
      - run: gdown --fuzzy 'https://drive.google.com/file/d/1nXcZGMdqDNhXq5VKOk-ZLw3wRxTQ0t5N/view' -O ship.zip
      - run: unzip -o ship.zip -d .
      - run: rm -f projects/adventureworks-analysis/docs/Project-Description.pdf
      - run: |
          git config user.email "action@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -m "add adventureworks dashboard gallery, redact documentation, drop project description"
          git push
