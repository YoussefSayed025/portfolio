name: ship-zerofix
on:
  push:
    paths:
      - '.github/workflows/zerofix.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown 1PYP4rLHQ3rqbFvPZdosaxf7lA8HJOVxe -O /tmp/s.zip && unzip -o /tmp/s.zip -d .
      - run: |
          git config user.name youssef
          git config user.email youssef@example.com
          git add -A
          git commit -m "restore cover border and remove page number zero"
          git push
