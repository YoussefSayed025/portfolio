name: ship-hrmerge
on:
  push:
    paths:
      - '.github/workflows/hrmerge.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown 1TeojV7wg9bK6xWz8EpSak3Se4wITUebN -O /tmp/s.zip && unzip -o /tmp/s.zip -d .
      - run: |
          git config user.name youssef
          git config user.email youssef@example.com
          git add -A
          git commit -m "merge hr trends into hr analytics project"
          git push
