name: ship-redact2
on:
  push:
    paths:
      - .github/workflows/ship-redact2.yml
jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown "1TiE1cFquhdumnxKgHq_oGZKsQBvMIpO2" -O r.zip && unzip -o r.zip && rm -f r.zip && git config user.email "bot@users.noreply.github.com" && git config user.name "ship-bot" && git add -A && git commit -m "Complete redaction of personal info on research paper covers" && git push
