name: apply-portfolio-polish
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified edits
        run: |
          cat > /tmp/payload.json <<'PAYLOAD'
          {"nav": "", "og": ""}
          PAYLOAD
          python3 - <<'PYSCRIPT'
          import base64,json,os,pathlib,re,sys
          pl=json.load(open('/tmp/payload.json'))
          p=pathlib.Path('index.html'); t=p.read_text(encoding='utf-8'); n0=len(t.encode())
          def rep(old,new,cnt=1):
              global t
              c=t.count(old)
              if c!=cnt: print('COUNT MISMATCH',c,cnt,old[:60]); sys.exit(1)
              t=t.replace(old,new)
          # 1 shrink nav logo (1.9MB PNG -> small WebP)
          m=re.findall(r'(<img alt="YH" class="logo" src=")data:image/png;base64,[A-Za-z0-9+/=]+(")',t)
          if len(m)!=1: print('logo mismatch'); sys.exit(1)
          t=re.sub(r'(<img alt="YH" class="logo" src=")data:image/png;base64,[A-Za-z0-9+/=]+(")',lambda x:x.group(1)+'data:image/webp;base64,'+pl['nav']+x.group(2),t,count=1)
          U='https://youssefsayed025.github.io/portfolio/'
          ld={"@context":"https://schema.org","@type":"Person","name":"Youssef Hawass","jobTitle":"Freelance Data Analyst & Researcher","url":U,"image":U+"og-image.jpg","sameAs":["https://www.linkedin.com/in/youssef-hawass"],"alumniOf":{"@type":"CollegeOrUniversity","name":"Cairo University"},"knowsAbout":["Power BI","SQL","Python","Excel","Data cleaning","Data analysis","Research"]}
          head=('<meta content="#070a14" name="theme-color"/>\n'
           '<link href="'+U+'" rel="canonical"/>\n'
           '<meta content="'+U+'" property="og:url"/>\n'
           '<meta content="Youssef Hawass" property="og:site_name"/>\n'
           '<meta content="en_US" property="og:locale"/>\n'
           '<meta content="'+U+'og-image.jpg" property="og:image"/>\n'
           '<meta content="1200" property="og:image:width"/>\n<meta content="630" property="og:image:height"/>\n'
           '<meta content="Youssef Hawass, Freelance Data Analyst and Researcher" property="og:image:alt"/>\n'
           '<meta content="'+U+'og-image.jpg" name="twitter:image"/>\n'
           '<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin=""/>\n'
           '<script type="application/ld+json">'+json.dumps(ld,ensure_ascii=False)+'</script>')
          rep('<meta content="#070a14" name="theme-color"/>',head)
          rep('<meta content="summary" name="twitter:card"/>','<meta content="summary_large_image" name="twitter:card"/>')
          rep('\n</style>\n\n</head>','\n.skip{position:absolute;left:12px;top:-80px;z-index:300;background:var(--gold);color:#070a14;font-weight:700;padding:10px 16px;border-radius:10px;}\n.skip:focus{top:12px;}\n</style>\n\n</head>')
          rep('<body>\n','<body>\n<a class="skip" href="#challenges">Skip to content</a>\n')
          rep('const AR = {','const AR = {"Skip to content": "تخطَّ إلى المحتوى", ')
          p.write_text(t,encoding='utf-8'); print('APPLIED OK',n0,'->',len(t.encode()))
          if not (300000<len(t.encode())<n0): print('size sanity fail'); sys.exit(1)
          pathlib.Path('og-image.jpg').write_bytes(base64.b64decode(pl['og']))
          PYSCRIPT
      - name: Commit and push
        run: |
          git config user.name "YoussefSayed025"
          git config user.email "youssefsayed025@users.noreply.github.com"
          git add index.html og-image.jpg
          git commit -m "Shrink logo, add social preview and SEO meta, skip link"
          git push
