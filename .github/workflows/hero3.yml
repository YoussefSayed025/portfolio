name: ship-hero3
on:
  push:
    paths:
      - '.github/workflows/hero3.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown 1oFUf4R7purLecbjbynAO-7TbaE64av0Y -O /tmp/s.zip && unzip -o /tmp/s.zip -d .
      - run: |
          git config user.name youssef
          git config user.email youssef@example.com
          git add -A
          git commit -m "mirror hero chart line in arabic mode"
          git push
