name: ship-covers
on:
  push:
    paths:
      - '.github/workflows/covers.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown 1u4Txoofs6lYXC1Tq1j-JuvN7LrMSqt3c -O /tmp/s.zip && unzip -o /tmp/s.zip -d . && rm -f projects/bicycle-sales/pages/01.webp
      - run: |
          git config user.name youssef
          git config user.email youssef@example.com
          git add -A
          git commit -m "fix cover boxes and remove duplicate dashboard image"
          git push
