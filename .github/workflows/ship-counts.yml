name: ship-counts
on:
  push:
    paths:
      - .github/workflows/ship-counts.yml
jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown "197j49k5rOHVSOQSkZjyKUzTNZ3pabv8u" -O counts.zip && unzip -o counts.zip && rm -f counts.zip && git config user.email "bot@users.noreply.github.com" && git config user.name "ship-bot" && git add -A && git commit -m "Fix hero stats to match actual project counts" && git push
