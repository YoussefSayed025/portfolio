name: tmp-merge
on:
  push:
    paths: ['.github/workflows/tmp-merge.yml']
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo  | base64 -d | python3
      - run: |
          git config user.name "github-actions"
          git config user.email "a@b.c"
          git add -A
          git commit -m "Merge data entry and research sections"
          git push
