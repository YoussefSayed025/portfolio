name: ship-ar
on:
  push:
    paths:
      - .github/workflows/ship-ar.yml
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown 1BsMs0eSsxCs1mTro8de0DiQIjDdLs3nG -O /tmp/s.zip && unzip -o /tmp/s.zip -d .
      - run: git config user.email "action@github.com" && git config user.name "github-actions" && git add -A && git commit -m "Arabic mode audit translations and fixes" && git push
