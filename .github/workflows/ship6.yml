name: ship-hr
on: [push]
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown
      - run: gdown 1lTdlk0STQEJ1rQxD0xCMxXisebEXK4v1 -O ship.zip
      - run: unzip -o ship.zip -d .
      - run: |
          git config user.email "action@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -m "add hr analytics gallery and updated dashboard file"
          git push
