name: ship-audit
on: [push]
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown
      - run: gdown 1j_OzI7mEu_WdN8ez1oPMJaplr2i7RGAC -O ship.zip
      - run: unzip -o ship.zip -d .
      - run: rm -f ship.zip
      - run: |
          git config user.email "action@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -m "audit fixes - new cv, drop stray zip, card images as files"
          git push
