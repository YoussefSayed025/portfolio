name: apply-linkedin-updates
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified string replacements
        run: |
          python3 - <<'PYSCRIPT'
          import base64, json, pathlib, sys
          pairs = json.loads(base64.b64decode('').decode('utf-8'))
          p = pathlib.Path('index.html')
          t = p.read_text(encoding='utf-8')
          orig_len = len(t.encode('utf-8'))
          for old, new, cnt in pairs:
              found = t.count(old)
              if found != cnt:
                  print('COUNT MISMATCH', found, '!=', cnt, repr(old[:80])); sys.exit(1)
              t = t.replace(old, new)
          p.write_text(t, encoding='utf-8')
          print('APPLIED OK', orig_len, '->', len(t.encode('utf-8')))
          PYSCRIPT
      - name: Commit and push
        run: |
          git config user.name "YoussefSayed025"
          git config user.email "youssefsayed025@users.noreply.github.com"
          git add index.html
          git commit -m "Add LinkedIn details: GPA, languages, certifications, EALB internship, NTI score, AdventureWorks project"
          git push
