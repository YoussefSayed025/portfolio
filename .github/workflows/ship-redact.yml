name: ship-redact
on:
  push:
    paths:
      - .github/workflows/ship-redact.yml
jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown "18oS4y58GlxfPLzL7bTmc9Gsfi02FX-mJ" -O r.zip && unzip -o r.zip && rm -f r.zip && git config user.email "bot@users.noreply.github.com" && git config user.name "ship-bot" && git add -A && git commit -m "Redact personal info from published research papers" && git push
