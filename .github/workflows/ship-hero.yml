name: ship-hero
on:
  push:
    paths:
      - .github/workflows/ship-hero.yml
jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown "1ZWbOU5GnidkCuVyXoM1wpseHt-my4ioe" -O h.zip && unzip -o h.zip && rm -f h.zip && git config user.email "bot@users.noreply.github.com" && git config user.name "ship-bot" && git add -A && git commit -m "Add animated rising chart to hero background" && git push
