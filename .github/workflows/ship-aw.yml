name: ship-aw
on:
  push:
    paths:
      - .github/workflows/ship-aw.yml
jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown "1Gv5kvmne4uUXzMZPGeumQeXJTiAtWtc2" -O aa && gdown "1WmBagb6Iwa9fWjjw9yGIhiqjb7HwVix3" -O ab && cat aa ab > bundle.zip && unzip -o bundle.zip && git config user.email "bot@users.noreply.github.com" && git config user.name "ship-bot" && git add -A && git commit -m "Ship adventureworks-analysis project files" && git push
