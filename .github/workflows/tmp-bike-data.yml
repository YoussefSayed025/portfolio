name: tmp-bike-data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install gdown
          gdown 1M0yH3ZrG4oRte6X9UeKH9QWTmwMzZyIn -O /tmp/ship.zip
          unzip -o /tmp/ship.zip -d .
          git config user.name youssef-bot
          git config user.email bot@local
          git add -A
          git commit -m 'Bicycle sales: pbix, dataset, docs, second dashboard image'
          git push
